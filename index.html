<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>领取优惠</title>

    <style>
        body {
            margin: 0;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f7f7f7;
        }

        /* 顶部栏 */
        .header {
            background: #f59a23;     /* 橙色背景 */
            color: #fff;
            text-align: center;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
        }

        /* 页面内容区 */
        .container {
            margin-top: 60px; /* 给顶部导航腾位置 */
            padding: 16px;
            background: #fff;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 10px;
        }

        /* 顶部 LOGO */
        .top-logo {
            width: 140px;
            display: block;
            margin: 0 auto 20px;
        }

        /* 商家 logo */
        .merchant-logo {
            width: 80px;
            display: block;
            margin: 0 auto 10px;
        }

        .title {
            text-align: center;
            font-size: 20px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .main-img {
            width: 100%;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <!-- 顶部导航栏 -->
    <div class="header">领取优惠</div>

    <!-- 内容区 -->
    <div class="container">

        <img class="top-logo" src="https://via.placeholder.com/200x60?text=%E6%8E%A8%E8%BF%9B%E7%8E%B0%E7%BD%91" alt="携程全球购 Logo">

        <img class="merchant-logo" src="https://via.placeholder.com/100x60?text=LOTTE" alt="乐天 Logo">

        <div class="title">乐天免税店</div>
        <div class="subtitle">高达300美金满减优惠券</div>

        <img class="main-img" src="https://dimg04.c-ctrip.com/images/0zd0u12000o6bhmco207D.png" alt="大图展示">

    </div>

</body>
</html>
